<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoDropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
    <linearGradient id="logoSaffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="logoGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#003366" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Emblem Group at (40, 40) -->
  <g transform="translate(4, 4)" filter="url(#logoShadow)">
    <circle cx="36" cy="36" r="35" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="1.5" />
    <!-- Saffron Swirl -->
    <path d="M 14 32 C 14 16 26 8 40 6 C 31 9 22 17 21 28 C 20 33 16 35 14 32 Z" fill="url(#logoSaffronGrad)" />
    <!-- Green Swirl -->
    <path d="M 58 40 C 58 56 46 64 32 66 C 41 63 50 55 51 44 C 52 39 56 37 58 40 Z" fill="url(#logoGreenGrad)" />
    <!-- Droplet -->
    <path d="M 36 12 C 36 12 18 34 18 46 C 18 56 26 64 36 64 C 46 64 54 56 54 46 C 54 34 36 12 36 12 Z" fill="url(#logoDropGrad)" />
    <!-- Highlight -->
    <path d="M 28 32 C 25 38 25 46 31 52 C 29 49 28 44 30 38 C 31 34 33 32 33 32 Z" fill="#ffffff" opacity="0.5" />
    <!-- Purity Wave -->
    <path d="M 26 48 Q 32 52 36 48 T 46 48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" />
    <circle cx="36" cy="38" r="2" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <!-- Devanagari Main Brand -->
  <text x="86" y="36" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-weight="900" font-size="22" fill="#003366">
    भारत <tspan fill="#0284c7">पेयजल</tspan>
  </text>

  <!-- English Subtitle & Tagline -->
  <text x="88" y="52" font-family="'Poppins', sans-serif" font-weight="800" font-size="9.5" letter-spacing="2.5" fill="#003366">
    BHARAT PEYJAL
  </text>
  <text x="88" y="65" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-weight="600" font-size="8.5" fill="#15803d">
    • जल मित्र आधिकारिक ऐप
  </text>
</svg>
